name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (semver, with or without leading "v"). Leave empty to only run the checks.'
        required: false
        type: string
        default: ''
      skip_changelog:
        description: 'Skip the CHANGELOG.md check'
        required: false
        type: boolean
        default: false
      prerelease:
        description: 'Mark the release as a pre-release'
        required: false
        type: boolean
        default: false
      draft:
        description: 'Create the release as a draft'
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  APT_PACKAGES: >-
    build-essential
    pkg-config
    libsodium-dev
  # Pull requests skip the changelog check by carrying this label.
  SKIP_CHANGELOG_LABEL: 'ci/skip-changelog'

jobs:
  changelog:
    name: Changelog
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Two ways to skip: the label on a pull request, or the checkbox on a
      # manual run. Either one turns the rest of this job into a no-op.
      - name: Resolve skip
        id: skip
        env:
          LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
          INPUT_SKIP: ${{ inputs.skip_changelog }}
        run: |
          skip=false
          reason=""

          if [ "$INPUT_SKIP" = "true" ]; then
            skip=true
            reason="the 'Skip the CHANGELOG.md check' box was ticked"
          elif printf '%s' ",$LABELS," | grep -qF ",$SKIP_CHANGELOG_LABEL,"; then
            skip=true
            reason="the '$SKIP_CHANGELOG_LABEL' label is applied"
          fi

          if [ "$skip" = "true" ]; then
            echo "::notice::Changelog check skipped, $reason."
            echo "Changelog check skipped: $reason." >> "$GITHUB_STEP_SUMMARY"
          fi

          echo "skip=$skip" >> "$GITHUB_OUTPUT"

      - name: Check that CHANGELOG.md exists
        if: steps.skip.outputs.skip == 'false'
        run: |
          if [ ! -f CHANGELOG.md ]; then
            echo "::error::CHANGELOG.md is missing"
            exit 1
          fi

      # Pull request: the branch has to touch CHANGELOG.md.
      - name: Check for a changelog entry
        if: steps.skip.outputs.skip == 'false' && github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          if git diff --name-only "origin/$BASE_REF...HEAD" | grep -qx 'CHANGELOG.md'; then
            echo "::notice::CHANGELOG.md was updated."
            exit 0
          fi

          echo "::error::CHANGELOG.md was not updated. Add an entry under '## [Unreleased]', or apply the '$SKIP_CHANGELOG_LABEL' label."
          exit 1

      # Release run: the version being cut has to have its own section.
      - name: Check for a released section
        if: steps.skip.outputs.skip == 'false' && github.event_name == 'workflow_dispatch' && inputs.version != ''
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          version="${INPUT_VERSION#v}"

          if ! grep -q "^## \[$version\]" CHANGELOG.md; then
            echo "::error::No '## [$version]' section in CHANGELOG.md. Add one, or tick 'Skip the CHANGELOG.md check'."
            exit 1
          fi

          echo "::notice::Found the CHANGELOG.md section for $version."

  format:
    name: Format
    runs-on: ubuntu-latest
    # Advisory for now: the tree has never been run through `make format`, and
    # the vendored headers under include/libs are formatted as upstream ships
    # them. Drop this line once `make format-check` is clean.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: Install clang-format
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang-format

      - name: Check formatting
        run: make format-check

  test:
    name: Test (${{ matrix.os }}, ${{ matrix.cc }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04]
        cc: [gcc, clang]
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends $APT_PACKAGES ${{ matrix.cc }}

      - name: Build
        run: make CC=${{ matrix.cc }} -j"$(nproc)"

      - name: Test
        run: make CC=${{ matrix.cc }} test

      - name: Round trip
        run: |
          set -euo pipefail

          head -c 4096 /dev/urandom > payload.bin

          for codec in lsbr lsbm; do
            for phrase in "correct horse battery staple" ""; do
              printf '%s\n' "$phrase" | ./hh encode assets/hush.png payload.bin -o "carrier-$codec.png" -c "$codec"
              printf '%s\n' "$phrase" | ./hh decode "carrier-$codec.png" -o "recovered-$codec.bin"
              ./devtools/checksum.sh payload.bin "recovered-$codec.bin"
            done
          done

  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends $APT_PACKAGES lcov

      - name: Run coverage
        run: make coverage

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-html
          path: coverage/html
          retention-days: 14

  prepare:
    name: Prepare release
    if: github.event_name == 'workflow_dispatch' && inputs.version != ''
    needs: [changelog]
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate version
        id: version
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          version="${INPUT_VERSION#v}"

          if ! printf '%s' "$version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$'; then
            echo "::error::'$INPUT_VERSION' is not a valid semantic version (e.g. 1.2.3 or v1.2.3-rc.1)"
            exit 1
          fi

          tag="v$version"

          if git rev-parse -q --verify "refs/tags/$tag" >/dev/null; then
            echo "::error::Tag $tag already exists"
            exit 1
          fi

          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "Releasing $tag" >> "$GITHUB_STEP_SUMMARY"

  release-build:
    name: Release build (${{ matrix.os }})
    if: github.event_name == 'workflow_dispatch' && inputs.version != ''
    needs: [prepare, test, coverage]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04]
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends $APT_PACKAGES

      - name: Build
        run: make CC="cc -O2" -j"$(nproc)"

      - name: Package
        id: package
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          name="hush-hush-${VERSION}-linux-$(uname -m)-${{ matrix.os }}"
          mkdir -p "dist/$name"
          cp hh README.md CHANGELOG.md LICENSE "dist/$name/"
          tar -czf "dist/$name.tar.gz" -C dist "$name"
          (cd dist && sha256sum "$name.tar.gz" > "$name.tar.gz.sha256")
          echo "name=$name" >> "$GITHUB_OUTPUT"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.package.outputs.name }}
          path: |
            dist/*.tar.gz
            dist/*.sha256
          if-no-files-found: error

  publish:
    name: Publish release
    if: github.event_name == 'workflow_dispatch' && inputs.version != ''
    needs: [prepare, release-build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      # The section for this version, when there is one. With the changelog
      # check skipped the release falls back to generated notes.
      - name: Extract release notes
        id: notes
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          awk -v ver="$VERSION" '
            /^## \[/ {
              if (found) exit
              heading = $0
              sub(/^## \[/, "", heading)
              sub(/\].*$/, "", heading)
              if (heading == ver) found = 1
              next
            }
            found && /^\[[^]]+\]:/ { exit }
            found { print }
          ' CHANGELOG.md | sed -e '/./,$!d' | tac | sed -e '/./,$!d' | tac > release-notes.md

          if [ -s release-notes.md ]; then
            echo "found=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::No CHANGELOG.md section for $VERSION, falling back to generated notes."
            echo "found=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create tag
        env:
          TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" -m "Release $TAG"
          git push origin "$TAG"

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.prepare.outputs.tag }}
          DRAFT: ${{ inputs.draft }}
          PRERELEASE: ${{ inputs.prerelease }}
          HAS_NOTES: ${{ steps.notes.outputs.found }}
        run: |
          args=(--title "$TAG" --target "$GITHUB_SHA")

          if [ "$HAS_NOTES" = "true" ]; then
            args+=(--notes-file release-notes.md)
          else
            args+=(--generate-notes)
          fi

          if [ "$DRAFT" = "true" ]; then args+=(--draft); fi
          if [ "$PRERELEASE" = "true" ]; then args+=(--prerelease); fi

          gh release create "$TAG" "${args[@]}" dist/*.tar.gz dist/*.sha256
          echo "Published $TAG" >> "$GITHUB_STEP_SUMMARY"
