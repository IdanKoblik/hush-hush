name: Release build

on:
  workflow_call:
    inputs:
      version:
        description: 'Release version, without the leading v'
        required: true
        type: string

permissions:
  contents: read

env:
  APT_PACKAGES: >-
    build-essential
    cmake
    pkg-config
    libsodium-dev
    libjpeg-dev

jobs:
  build:
    name: Release build (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      # One build per architecture rather than per Ubuntu release. The assets no
      # longer carry the runner's OS in their names, so two Ubuntu versions of
      # the same architecture would collide once the publish job merges the
      # artifacts. 22.04 is the floor for both: it links against the oldest
      # glibc the runners offer, so the binaries run in the most places.
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-22.04
          - arch: aarch64
            runner: ubuntu-22.04-arm
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends $APT_PACKAGES

      - name: Build
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DHH_BUILD_TESTS=OFF
          cmake --build build -j"$(nproc)"

      - name: Package
        id: package
        env:
          VERSION: ${{ inputs.version }}
          ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail

          # The architecture comes from the matrix, not from uname, so that the
          # name is decided in one place. Checking the two agree turns a
          # mislabelled runner into a failure here instead of an aarch64 build
          # published under an x86_64 name.
          if [ "$(uname -m)" != "$ARCH" ]; then
            echo "::error::Runner reports $(uname -m), the matrix expected $ARCH"
            exit 1
          fi

          name="hush-hush-${VERSION}-linux-${ARCH}"
          root="dist/$name"

          mkdir -p "$root/bin" "$root/lib" "$root/include"

          cp build/hh "$root/bin/"
          cp build/lib/libhushhush.a "$root/lib/"

          # The headers keep their core/ prefix, so a consumer only needs
          # -Iinclude to compile its existing <core/...> includes against the
          # shipped library.
          find core -name '*.h' -not -path 'core/tests/*' \
            -exec cp --parents {} "$root/include/" \;

          cp README.md CHANGELOG.md LICENSE "$root/"

          tar -czf "dist/$name.tar.gz" -C dist "$name"

          # The same two files again, loose beside the tarball: the release page
          # is then a one-click download for someone who only wants the CLI, or
          # only the library to link against, without unpacking anything. The
          # architecture suffix keeps them from colliding across the matrix.
          suffix="${name#hush-hush-}"
          cp "$root/bin/hh" "dist/hh-$suffix"
          cp "$root/lib/libhushhush.a" "dist/libhushhush-$suffix.a"

          echo "name=$name" >> "$GITHUB_OUTPUT"

          echo "### $name" >> "$GITHUB_STEP_SUMMARY"
          tar -tzf "dist/$name.tar.gz" | sed 's/^/    /' >> "$GITHUB_STEP_SUMMARY"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.package.outputs.name }}
          path: |
            dist/*.tar.gz
            dist/hh-*
            dist/libhushhush-*.a
          if-no-files-found: error
